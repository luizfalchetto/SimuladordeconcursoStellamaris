name: Enable GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages (deploy from branch main, root)
        run: |
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source":{"branch":"main","path":"/"}}')
          BODY=$(cat /tmp/resp.json | tr '\n' ' ')
          echo "HTTP status: $STATUS"
          echo "$BODY"
          echo "::error::HTTP $STATUS - $BODY"
          if [ "$STATUS" = "201" ] || [ "$STATUS" = "409" ]; then
            echo "Pages já habilitado ou habilitado com sucesso."
            exit 0
          fi
          exit 1
